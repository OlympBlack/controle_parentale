openapi: 3.0.0
info:
  title: 'Contrôle Parental API'
  description: "API REST pour l'application de Contrôle Parental - gestion des familles, enfants, appareils, règles de filtrage, temps d'écran, alertes et rapports."
  version: 1.0.0
servers:
  - url: 'http://localhost:8000'
    description: 'Serveur local'
paths:
  /api/activities:
    get:
      tags:
        - Activities
      summary: 'Liste des activités'
      description: 'Retourne les activités (paginées), filtrable par child_id et device_id'
      operationId: activitiesIndex
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: child_id
          in: query
          schema:
            type: integer
        -
          name: device_id
          in: query
          schema:
            type: integer
      responses:
        200:
          description: 'Liste paginée des activités'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Liste des activités'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'
                  meta:
                    type: object
                  links:
                    type: object
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
  '/api/activities/{activity}':
    get:
      tags:
        - Activities
      summary: "Détails d'une activité"
      operationId: activitiesShow
      parameters:
        -
          name: activity
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: "Détails de l'activité"
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Détails de l'activité"
                  data:
                    $ref: '#/components/schemas/Activity'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
  /api/alerts:
    get:
      tags:
        - Alerts
      summary: 'Liste des alertes'
      description: 'Retourne les alertes (paginées), filtrable par child_id, severity et status'
      operationId: alertsIndex
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: child_id
          in: query
          schema:
            type: integer
        -
          name: severity
          in: query
          schema:
            type: string
            enum:
              - low
              - medium
              - high
              - critical
        -
          name: status
          in: query
          schema:
            type: string
            enum:
              - new
              - acknowledged
              - resolved
              - dismissed
      responses:
        200:
          description: 'Liste paginée des alertes'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Liste des alertes'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
                  meta:
                    type: object
                  links:
                    type: object
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
  '/api/alerts/{alert}':
    get:
      tags:
        - Alerts
      summary: "Détails d'une alerte"
      operationId: alertsShow
      parameters:
        -
          name: alert
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: "Détails de l'alerte"
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Détails de l'alerte"
                  data:
                    $ref: '#/components/schemas/Alert'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
  '/api/alerts/{alert}/status':
    patch:
      tags:
        - Alerts
      summary: "Mettre à jour le statut d'une alerte"
      operationId: alertsUpdateStatus
      parameters:
        -
          name: alert
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - status
              properties:
                status:
                  type: string
                  example: resolved
                  enum:
                    - new
                    - acknowledged
                    - resolved
                    - dismissed
              type: object
      responses:
        200:
          description: 'Statut mis à jour'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Statut de l'alerte mis à jour"
                  data:
                    $ref: '#/components/schemas/Alert'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
      security:
        -
          sanctum: []
  /api/register:
    post:
      tags:
        - Auth
      summary: "Inscription d'un nouvel utilisateur"
      description: "Crée un compte parent et retourne un token d'authentification"
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: 'Jean Dupont'
                email:
                  type: string
                  format: email
                  example: jean@exemple.com
                phone:
                  type: string
                  example: '+33612345678'
                password:
                  type: string
                  format: password
                  example: password123
                password_confirmation:
                  type: string
                  format: password
                  example: password123
                device_name:
                  type: string
                  example: 'Chrome Browser'
              type: object
      responses:
        201:
          description: 'Compte créé avec succès'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Compte créé avec succès'
                  data:
                    properties:
                      token:
                        type: string
                        example: 1|abcdef123456
                      user:
                        $ref: '#/components/schemas/User'
                    type: object
                type: object
        422:
          $ref: '#/components/responses/ValidationError'
  /api/login:
    post:
      tags:
        - Auth
      summary: 'Connexion utilisateur'
      description: 'Authentifie un utilisateur et retourne un token Bearer'
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: jean@exemple.com
                password:
                  type: string
                  format: password
                  example: password123
                device_name:
                  type: string
                  example: 'Chrome Browser'
              type: object
      responses:
        200:
          description: 'Connexion réussie'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Connexion réussie'
                  data:
                    properties:
                      token:
                        type: string
                        example: 1|abcdef123456
                      user:
                        $ref: '#/components/schemas/User'
                    type: object
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
  /api/logout:
    post:
      tags:
        - Auth
      summary: 'Déconnexion utilisateur'
      description: 'Révoque le token courant'
      operationId: logout
      responses:
        200:
          $ref: '#/components/responses/Success'
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
  /api/me:
    get:
      tags:
        - Auth
      summary: 'Utilisateur courant'
      description: "Retourne les informations de l'utilisateur authentifié"
      operationId: me
      responses:
        200:
          description: 'Profil utilisateur'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Profil utilisateur'
                  data:
                    $ref: '#/components/schemas/User'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
  /api/children:
    get:
      tags:
        - Children
      summary: 'Liste des enfants'
      description: 'Retourne les enfants (paginés), filtrable par family_id'
      operationId: childrenIndex
      parameters:
        -
          name: page
          in: query
          description: 'Numéro de page'
          schema:
            type: integer
            default: 1
        -
          name: family_id
          in: query
          description: 'Filtrer par famille'
          schema:
            type: integer
      responses:
        200:
          description: 'Liste paginée des enfants'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Liste des enfants'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
                  meta:
                    type: object
                  links:
                    type: object
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
    post:
      tags:
        - Children
      summary: 'Ajouter un enfant'
      operationId: childrenStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - family_id
                - first_name
                - birth_date
                - maturity_level
              properties:
                family_id:
                  type: integer
                  example: 1
                first_name:
                  type: string
                  example: Lucas
                last_name:
                  type: string
                  example: Dupont
                birth_date:
                  type: string
                  format: date
                  example: '2015-03-10'
                avatar:
                  type: string
                  nullable: true
                maturity_level:
                  type: string
                  example: enfant
                  enum:
                    - enfant
                    - preado
                    - ado
                pin_code:
                  type: string
                  example: '1234'
                  nullable: true
              type: object
      responses:
        201:
          description: 'Enfant ajouté'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Enfant ajouté'
                  data:
                    $ref: '#/components/schemas/Child'
                type: object
        422:
          $ref: '#/components/responses/ValidationError'
      security:
        -
          sanctum: []
  '/api/children/{child}':
    get:
      tags:
        - Children
      summary: "Détails d'un enfant"
      description: "Inclut les appareils, règles de filtrage, règles d'apps et règles de temps d'écran"
      operationId: childrenShow
      parameters:
        -
          name: child
          in: path
          description: "ID de l'enfant"
          required: true
          schema:
            type: integer
      responses:
        200:
          description: "Détails de l'enfant"
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Détails de l'enfant"
                  data:
                    $ref: '#/components/schemas/Child'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
    put:
      tags:
        - Children
      summary: 'Mettre à jour un enfant'
      operationId: childrenUpdate
      parameters:
        -
          name: child
          in: path
          description: "ID de l'enfant"
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                first_name:
                  type: string
                  example: Lucas
                last_name:
                  type: string
                  example: Dupont
                birth_date:
                  type: string
                  format: date
                  example: '2015-03-10'
                maturity_level:
                  type: string
                  example: preado
                  enum:
                    - enfant
                    - preado
                    - ado
                status:
                  type: string
                  example: active
                  enum:
                    - active
                    - paused
                    - archived
                digital_health_score:
                  type: integer
                  example: 85
              type: object
      responses:
        200:
          description: 'Enfant mis à jour'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Enfant mis à jour'
                  data:
                    $ref: '#/components/schemas/Child'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
      security:
        -
          sanctum: []
    delete:
      tags:
        - Children
      summary: 'Supprimer un enfant (soft delete)'
      operationId: childrenDestroy
      parameters:
        -
          name: child
          in: path
          description: "ID de l'enfant"
          required: true
          schema:
            type: integer
      responses:
        200:
          $ref: '#/components/responses/Success'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
  /api/devices:
    get:
      tags:
        - Devices
      summary: 'Liste des appareils'
      description: 'Retourne les appareils (paginés), filtrable par child_id'
      operationId: devicesIndex
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: child_id
          in: query
          schema:
            type: integer
      responses:
        200:
          description: 'Liste paginée des appareils'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Liste des appareils'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  meta:
                    type: object
                  links:
                    type: object
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
    post:
      tags:
        - Devices
      summary: 'Ajouter un appareil'
      operationId: devicesStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - child_id
                - name
                - type
              properties:
                child_id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: 'iPhone de Lucas'
                type:
                  type: string
                  example: smartphone
                os:
                  type: string
                  example: iOS
                os_version:
                  type: string
                  example: '17.2'
              type: object
      responses:
        201:
          description: 'Appareil ajouté'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Appareil ajouté'
                  data:
                    $ref: '#/components/schemas/Device'
                type: object
        422:
          $ref: '#/components/responses/ValidationError'
      security:
        -
          sanctum: []
  '/api/devices/{device}':
    get:
      tags:
        - Devices
      summary: "Détails d'un appareil"
      operationId: devicesShow
      parameters:
        -
          name: device
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: "Détails de l'appareil"
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Détails de l'appareil"
                  data:
                    $ref: '#/components/schemas/Device'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
    put:
      tags:
        - Devices
      summary: 'Mettre à jour un appareil'
      operationId: devicesUpdate
      parameters:
        -
          name: device
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  example: 'iPhone de Lucas'
                status:
                  type: string
                  example: paired
                  enum:
                    - paired
                    - unpaired
                    - locked
                    - lost
                is_online:
                  type: boolean
                  example: true
                battery_level:
                  type: integer
                  example: 75
              type: object
      responses:
        200:
          description: 'Appareil mis à jour'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Appareil mis à jour'
                  data:
                    $ref: '#/components/schemas/Device'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
    delete:
      tags:
        - Devices
      summary: 'Supprimer un appareil'
      operationId: devicesDestroy
      parameters:
        -
          name: device
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          $ref: '#/components/responses/Success'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
  /api/families:
    get:
      tags:
        - Families
      summary: 'Liste des familles'
      description: "Retourne les familles de l'utilisateur authentifié (paginées)"
      operationId: familiesIndex
      parameters:
        -
          name: page
          in: query
          description: 'Numéro de page'
          schema:
            type: integer
            default: 1
      responses:
        200:
          description: 'Liste paginée des familles'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Liste des familles'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Family'
                  meta:
                    type: object
                  links:
                    type: object
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
    post:
      tags:
        - Families
      summary: 'Créer une famille'
      operationId: familiesStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
              properties:
                name:
                  type: string
                  example: 'Famille Dupont'
                plan:
                  type: string
                  example: free
                  enum:
                    - free
                    - premium
              type: object
      responses:
        201:
          description: 'Famille créée'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Famille créée'
                  data:
                    $ref: '#/components/schemas/Family'
                type: object
        422:
          $ref: '#/components/responses/ValidationError'
      security:
        -
          sanctum: []
  '/api/families/{family}':
    get:
      tags:
        - Families
      summary: "Détails d'une famille"
      operationId: familiesShow
      parameters:
        -
          name: family
          in: path
          description: 'ID de la famille'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Détails de la famille'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Détails de la famille'
                  data:
                    $ref: '#/components/schemas/Family'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
    put:
      tags:
        - Families
      summary: 'Mettre à jour une famille'
      operationId: familiesUpdate
      parameters:
        -
          name: family
          in: path
          description: 'ID de la famille'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  example: 'Famille Dupont'
                plan:
                  type: string
                  example: premium
                  enum:
                    - free
                    - premium
              type: object
      responses:
        200:
          description: 'Famille mise à jour'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Famille mise à jour'
                  data:
                    $ref: '#/components/schemas/Family'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationError'
      security:
        -
          sanctum: []
    delete:
      tags:
        - Families
      summary: 'Supprimer une famille'
      description: 'Seul le propriétaire peut supprimer la famille'
      operationId: familiesDestroy
      parameters:
        -
          name: family
          in: path
          description: 'ID de la famille'
          required: true
          schema:
            type: integer
      responses:
        200:
          $ref: '#/components/responses/Success'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
  /api/locations:
    get:
      tags:
        - Locations
      summary: 'Liste des localisations'
      description: 'Retourne les localisations (paginées), filtrable par child_id'
      operationId: locationsIndex
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: child_id
          in: query
          schema:
            type: integer
      responses:
        200:
          description: 'Liste paginée des localisations'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Liste des localisations'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Location'
                  meta:
                    type: object
                  links:
                    type: object
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
  '/api/children/{childId}/locations/latest':
    get:
      tags:
        - Locations
      summary: "Dernière localisation d'un enfant"
      operationId: locationsLatest
      parameters:
        -
          name: childId
          in: path
          description: "ID de l'enfant"
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Dernière localisation'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Dernière localisation'
                  data:
                    $ref: '#/components/schemas/Location'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
  /api/notifications:
    get:
      tags:
        - Notifications
      summary: 'Liste des notifications'
      description: "Retourne les notifications de l'utilisateur authentifié (paginées)"
      operationId: notificationsIndex
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        200:
          description: 'Liste paginée des notifications'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Liste des notifications'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    type: object
                  links:
                    type: object
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
  '/api/notifications/{notification}':
    get:
      tags:
        - Notifications
      summary: "Détails d'une notification"
      operationId: notificationsShow
      parameters:
        -
          name: notification
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Détails de la notification'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Détails de la notification'
                  data:
                    $ref: '#/components/schemas/Notification'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
  '/api/notifications/{notification}/read':
    patch:
      tags:
        - Notifications
      summary: 'Marquer une notification comme lue'
      operationId: notificationsMarkAsRead
      parameters:
        -
          name: notification
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Notification marquée comme lue'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Notification marquée comme lue'
                  data:
                    $ref: '#/components/schemas/Notification'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
  /api/notifications/mark-all-read:
    post:
      tags:
        - Notifications
      summary: 'Marquer toutes les notifications comme lues'
      operationId: notificationsMarkAllAsRead
      responses:
        200:
          $ref: '#/components/responses/Success'
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
  /api/profile:
    get:
      tags:
        - Profile
      summary: 'Afficher le profil'
      operationId: profileShow
      responses:
        200:
          description: 'Profil utilisateur'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Profil utilisateur'
                  data:
                    $ref: '#/components/schemas/User'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
    put:
      tags:
        - Profile
      summary: 'Mettre à jour le profil'
      operationId: profileUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  example: 'Jean Dupont'
                email:
                  type: string
                  format: email
                  example: jean@exemple.com
                phone:
                  type: string
                  example: '+33612345678'
                avatar:
                  type: string
                  nullable: true
                locale:
                  type: string
                  example: fr
                timezone:
                  type: string
                  example: Europe/Paris
              type: object
      responses:
        200:
          description: 'Profil mis à jour'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Profil mis à jour'
                  data:
                    $ref: '#/components/schemas/User'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/ValidationError'
      security:
        -
          sanctum: []
  /api/reports:
    get:
      tags:
        - Reports
      summary: 'Liste des rapports'
      description: 'Retourne les rapports (paginés), filtrable par child_id et period_type'
      operationId: reportsIndex
      parameters:
        -
          name: page
          in: query
          schema:
            type: integer
            default: 1
        -
          name: child_id
          in: query
          schema:
            type: integer
        -
          name: period_type
          in: query
          schema:
            type: string
      responses:
        200:
          description: 'Liste paginée des rapports'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Liste des rapports'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
                  meta:
                    type: object
                  links:
                    type: object
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          sanctum: []
  '/api/reports/{report}':
    get:
      tags:
        - Reports
      summary: "Détails d'un rapport"
      operationId: reportsShow
      parameters:
        -
          name: report
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Détails du rapport'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Détails du rapport'
                  data:
                    $ref: '#/components/schemas/Report'
                type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
      security:
        -
          sanctum: []
components:
  schemas:
    User:
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Jean Dupont'
        email:
          type: string
          format: email
          example: jean@exemple.com
        phone:
          type: string
          example: '+33612345678'
        avatar:
          type: string
          nullable: true
        locale:
          type: string
          example: fr
        timezone:
          type: string
          nullable: true
        status:
          type: string
          example: active
          enum:
            - active
            - suspended
            - pending
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    Family:
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Famille Dupont'
        plan:
          type: string
          example: free
          enum:
            - free
            - premium
        owner:
          $ref: '#/components/schemas/User'
        children_count:
          type: integer
          example: 2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    Child:
      properties:
        id:
          type: integer
          example: 1
        family_id:
          type: integer
          example: 1
        first_name:
          type: string
          example: Lucas
        last_name:
          type: string
          example: Dupont
        full_name:
          type: string
          example: 'Lucas Dupont'
        birth_date:
          type: string
          format: date
          example: '2015-03-10'
        avatar:
          type: string
          nullable: true
        maturity_level:
          type: string
          example: enfant
          enum:
            - enfant
            - preado
            - ado
        status:
          type: string
          example: active
          enum:
            - active
            - paused
            - archived
        digital_health_score:
          type: integer
          example: 85
          nullable: true
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        devices_count:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    Device:
      properties:
        id:
          type: integer
          example: 1
        child_id:
          type: integer
          example: 1
        name:
          type: string
          example: 'iPhone de Lucas'
        type:
          type: string
          example: smartphone
        os:
          type: string
          example: iOS
        os_version:
          type: string
          example: '17.2'
        app_version:
          type: string
          nullable: true
        status:
          type: string
          example: paired
        is_online:
          type: boolean
          example: true
        battery_level:
          type: integer
          example: 75
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        paired_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    Activity:
      properties:
        id:
          type: integer
          example: 1
        child_id:
          type: integer
          example: 1
        device_id:
          type: integer
          example: 1
        type:
          type: string
          example: app_usage
        target:
          type: string
          example: com.youtube.app
        duration_seconds:
          type: integer
          example: 3600
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
      type: object
    Alert:
      properties:
        id:
          type: integer
          example: 1
        child_id:
          type: integer
          example: 1
        device_id:
          type: integer
          nullable: true
        type:
          type: string
          example: inappropriate_content
        severity:
          type: string
          example: high
          enum:
            - low
            - medium
            - high
            - critical
        message:
          type: string
          example: "Tentative d'accès à un site bloqué"
        status:
          type: string
          example: new
          enum:
            - new
            - acknowledged
            - resolved
            - dismissed
        triggered_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      type: object
    Notification:
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        alert_id:
          type: integer
          nullable: true
        channel:
          type: string
          example: push
        title:
          type: string
          example: 'Nouvelle alerte'
        body:
          type: string
          example: "Lucas a tenté d'accéder à..."
        status:
          type: string
          example: sent
        sent_at:
          type: string
          format: date-time
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
    Report:
      properties:
        id:
          type: integer
          example: 1
        child_id:
          type: integer
          example: 1
        period_type:
          type: string
          example: weekly
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        digital_health_score:
          type: integer
          example: 85
        statistics:
          type: object
        file_path:
          type: string
          nullable: true
        generated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      type: object
    FilterRule:
      properties:
        id:
          type: integer
          example: 1
        child_id:
          type: integer
          example: 1
        type:
          type: string
          example: domain
          enum:
            - domain
            - keyword
            - category
            - app
        value:
          type: string
          example: example.com
        status:
          type: string
          example: active
          enum:
            - active
            - paused
            - disabled
        version:
          type: integer
          example: 1
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ContentCategory'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    ScreenTimeRule:
      properties:
        id:
          type: integer
          example: 1
        child_id:
          type: integer
          example: 1
        type:
          type: string
          example: daily
          enum:
            - daily
            - weekly
            - schedule
        duration_minutes:
          type: integer
          example: 120
        day_of_week:
          type: integer
          example: 1
          nullable: true
        start_time:
          type: string
          example: '08:00'
          nullable: true
        end_time:
          type: string
          example: '20:00'
          nullable: true
        status:
          type: string
          example: active
          enum:
            - active
            - paused
            - disabled
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    AppRule:
      properties:
        id:
          type: integer
          example: 1
        child_id:
          type: integer
          example: 1
        application_id:
          type: integer
          example: 1
        status:
          type: string
          example: limited
          enum:
            - allowed
            - blocked
            - limited
        daily_quota_minutes:
          type: integer
          example: 60
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    Location:
      properties:
        id:
          type: integer
          example: 1
        child_id:
          type: integer
          example: 1
        device_id:
          type: integer
          example: 1
        latitude:
          type: number
          format: float
          example: 48.8566
        longitude:
          type: number
          format: float
          example: 2.3522
        accuracy_meters:
          type: number
          example: 10.5
          nullable: true
        recorded_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      type: object
    ContentCategory:
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Réseaux sociaux'
        slug:
          type: string
          example: social-media
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
  responses:
    Success:
      description: 'Opération réussie'
      content:
        application/json:
          schema:
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: 'Opération réussie'
              data:
                type: object
                nullable: true
            type: object
    Unauthorized:
      description: 'Non authentifié'
      content:
        application/json:
          schema:
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Unauthenticated.
            type: object
    ValidationError:
      description: 'Erreur de validation'
      content:
        application/json:
          schema:
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: 'Validation error'
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
            type: object
    NotFound:
      description: 'Ressource introuvable'
      content:
        application/json:
          schema:
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: 'Ressource introuvable'
            type: object
    Forbidden:
      description: 'Action non autorisée'
      content:
        application/json:
          schema:
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: 'Action non autorisée'
            type: object
  securitySchemes:
    sanctum:
      type: apiKey
      description: 'Enter token in format (Bearer <token>)'
      name: Authorization
      in: header
tags:
  - name: Auth
    description: 'Authentification - inscription, connexion, déconnexion'
  - name: Profile
    description: 'Gestion du profil utilisateur'
  - name: Families
    description: 'Gestion des familles'
  - name: Children
    description: 'Gestion des enfants'
  - name: Devices
    description: 'Gestion des appareils'
  - name: Activities
    description: 'Consultation des activités'
  - name: Alerts
    description: 'Gestion des alertes'
  - name: Notifications
    description: 'Gestion des notifications'
  - name: Reports
    description: 'Consultation des rapports'
  - name: Locations
    description: 'Localisation des enfants'
security:
  -
    sanctum: []
